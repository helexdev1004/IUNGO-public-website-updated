# ==========================================================================
# Netlify configuration — IUNGO Technology
# --------------------------------------------------------------------------
# FORMS: the site has two — "contact" and "careers". Where their submissions
# are emailed CANNOT be set here; Netlify has no netlify.toml option for it.
# Set it once per form in the dashboard:
#   Forms → Form submission notifications → Add notification → Email notification
# A notification on "any form" covers both. The recipient address is kept out
# of this public repo; see DEPLOYMENT.local.md.
# Until that is done, submissions are stored under Forms but nobody is emailed.
# ==========================================================================

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# --------------------------------------------------------------------------
# SPA routing
# React Router owns the URLs, so every path that is not a real file must be
# served index.html. Status 200 (not 301) keeps the URL the visitor typed.
# --------------------------------------------------------------------------
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# --------------------------------------------------------------------------
# Security headers
# --------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"

# Fingerprinted build output never changes under the same name — cache hard.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
